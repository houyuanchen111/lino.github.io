<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码逻辑验证</title>
    <style>
        /* CSS样式直接放在这里 */
        body {
            font-family: system-ui, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .showcase-container {
            width: 100%;
            max-width: 900px;
        }
        .display-area {
            display: flex;
            gap: 20px;
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
            height: 400px; /* 给一个固定高度以便观察 */
        }
        .single-image-container {
            flex: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            border-radius: 8px;
            overflow: hidden;
        }
        #main-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .normal-maps-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        #normal-map-1,
        #normal-map-2 {
            width: 100%;
            flex: 1;
            object-fit: contain;
            background-color: #f0f0f0;
            border-radius: 8px;
        }
        .selection-panel {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .select-box {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            border: 4px solid #ddd;
            cursor: pointer;
            transition: all 0.25s ease;
            object-fit: cover;
        }
        .select-box:hover {
            border-color: #007aff;
        }
        .select-box.selected {
            border-color: #007aff;
            box-shadow: 0 0 20px rgba(0, 122, 255, 0.6);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="showcase-container">
    <div class="display-area">
        <div class="single-image-container">
            <img id="main-image" src="https://via.placeholder.com/400x400/cccccc/000000?text=Initial" alt="Main Image">
        </div>
        <div class="normal-maps-column">
            <img id="normal-map-1" src="https://via.placeholder.com/200x200/cccccc/000000?text=Initial" alt="Normal Map 1">
            <img id="normal-map-2" src="https://via.placeholder.com/200x200/cccccc/000000?text=Initial" alt="Normal Map 2">
        </div>
    </div>

    <div class="selection-panel">
        <img class="select-box selected"
             src="https://via.placeholder.com/80x80/FF5733/FFFFFF?text=Set+1"
             data-main-src="https://via.placeholder.com/400x400/FF5733/FFFFFF?text=Main+1"
             data-normal-1="https://via.placeholder.com/200x200/FF5733/FFFFFF?text=Normal+1.1"
             data-normal-2="https://via.placeholder.com/200x200/FF5733/FFFFFF?text=Normal+1.2"
             alt="Thumbnail 1">

        <img class="select-box"
             src="https://via.placeholder.com/80x80/33FF57/FFFFFF?text=Set+2"
             data-main-src="https://via.placeholder.com/400x400/33FF57/FFFFFF?text=Main+2"
             data-normal-1="https://via.placeholder.com/200x200/33FF57/FFFFFF?text=Normal+2.1"
             data-normal-2="https://via.placeholder.com/200x200/33FF57/FFFFFF?text=Normal+2.2"
             alt="Thumbnail 2">
    </div>
</div>

<script>
    // JavaScript逻辑直接放在这里
    document.addEventListener('DOMContentLoaded', () => {

        // 3. JS通过这三个ID来准确地找到上面的三个图片元素
        const mainImage = document.getElementById('main-image');
        const normalMap1 = document.getElementById('normal-map-1');
        const normalMap2 = document.getElementById('normal-map-2');
        const selectBoxes = document.querySelectorAll('.select-box');

        function updateDisplay(selectedBox) {
            // 安全检查，确保所有元素都已找到
            if (!selectedBox || !mainImage || !normalMap1 || !normalMap2) {
                console.error("错误：一个或多个需要更新的图片元素没有在页面上找到。");
                return;
            }

            // 4. 从被点击的缩略图的 data-* 属性中读取新的图片路径
            const newMainSrc = selectedBox.dataset.mainSrc;
            const newNormal1Src = selectedBox.dataset.normal1;
            const newNormal2Src = selectedBox.dataset.normal2;

            // 5. 将新路径赋值给对应图片元素的 src 属性
            if (newMainSrc) mainImage.src = newMainSrc;
            if (newNormal1Src) normalMap1.src = newNormal1Src;
            if (newNormal2Src) normalMap2.src = newNormal2Src;

            // 更新选中样式
            selectBoxes.forEach(box => box.classList.remove('selected'));
            selectedBox.classList.add('selected');
        }

        // 为每个缩略图添加点击事件
        selectBoxes.forEach(box => {
            box.addEventListener('click', (event) => {
                updateDisplay(event.currentTarget);
            });
        });

        // 初始化页面时，加载默认选中的缩略图对应的内容
        const initiallySelectedBox = document.querySelector('.select-box.selected');
        if (initiallySelectedBox) {
            updateDisplay(initiallySelectedBox);
        }
    });
</script>

</body>
</html>
